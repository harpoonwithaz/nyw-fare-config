spring.application.name=nyw-fare-config
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m
spring.thymeleaf.cache=false

# This file replaces the main application.properties during tests, so the Caracal
# and tenant settings are repeated here. Tests mock Caracal and never call this URL.
app.tenants.default-grid-mode=OD
app.tenants.grid-modes.NYW_SANDBOX=OD
app.tenants.grid-modes.METRA=ZONAL
app.tenants.excluded-codes=NYW,SCCP
caracal.api.base-url=http://localhost:8080
caracal.api.connect-timeout=1s
caracal.api.read-timeout=1s
