# Test profile (@ActiveProfiles("test")): only overrides on top of src/main/resources/application.properties
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Tests mock Caracal and never call this URL
caracal.api.base-url=http://localhost:8080
caracal.api.connect-timeout=1s
caracal.api.read-timeout=1s
