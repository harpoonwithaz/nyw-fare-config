spring.application.name=nyw-fare-config

# DB credentials come from local.properties (git-ignored, never committed)
spring.config.import=optional:file:./local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sessions stored in PostgreSQL + auto-logout after inactivity
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m

spring.thymeleaf.cache=false