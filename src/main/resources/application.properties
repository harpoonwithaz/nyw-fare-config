spring.application.name=nyw-fare-config
server.port=9876

# Supported tenant grid modes (comma-separated tenant codes)
app.tenants.od-codes=NYW,NYW_SANDBOX
app.tenants.zonal-codes=METRA

# ==========================================
# Caracal Api Client
# ==========================================
caracal.api.base-url=${CARACAL_API_BASE_URL}
caracal.api.connect-timeout=3s
caracal.api.read-timeout=5s
caracal.api.metra-config-path=${CARACAL_METRA_CONFIG_PATH:config/metra.json}
caracal.api.nyw-sheet-path=${CARACAL_NYW_SHEET_PATH:config/nyw-sheet-2026-09-25.json}

# ==========================================
# Database & Datasource (Injected via .env / Render)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ==========================================
# Spring Session (PostgreSQL)
# ==========================================
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m

# ==========================================
# View & Templates
# ==========================================
spring.thymeleaf.cache=false