spring.application.name=nyw-fare-config
server.port=9876

# Default mode when a brand-new O-D tenant is added in Caracal
app.tenants.default-grid-mode=OD

# Explicit overrides for Zonal tenants (or any custom tenant codes)
app.tenants.grid-modes.NYW_SANDBOX=OD
app.tenants.grid-modes.METRA=ZONAL

# Tenants to hide from the UI dropdown (e.g., read-only reference or parking tenants)
app.tenants.excluded-codes=NYW,SCCP

# ==========================================
# Caracal Api Client
# ==========================================
caracal.api.base-url=${CARACAL_API_BASE_URL}
caracal.api.connect-timeout=3s
caracal.api.read-timeout=5s

# ==========================================
# Database & Datasource (Injected via .env / Render)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ==========================================
# Spring Session (PostgreSQL)
# ==========================================
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m

# ==========================================
# View & Templates
# ==========================================
spring.thymeleaf.cache=false