<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - NYW Fare Configuration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="card shadow-sm text-center">
                    <div class="card-body p-5">

                        <div class="alert alert-success" th:if="${param.passwordChanged != null}">
                            Your password has been updated.
                        </div>

                        <svg viewBox="0 0 300 150" width="280" class="mb-3" xmlns="http://www.w3.org/2000/svg"
                            role="img" aria-label="Ferry on the water">
                            <circle cx="245" cy="35" r="18" fill="#ffd166" />
                            <rect x="130" y="20" width="20" height="20" fill="#e63946" />
                            <rect x="105" y="40" width="70" height="20" fill="#ffffff" stroke="#0b5ea8"
                                stroke-width="3" />
                            <rect x="85" y="60" width="110" height="25" fill="#ffffff" stroke="#0b5ea8"
                                stroke-width="3" />
                            <circle cx="105" cy="72" r="5" fill="#8ecae6" />
                            <circle cx="130" cy="72" r="5" fill="#8ecae6" />
                            <circle cx="155" cy="72" r="5" fill="#8ecae6" />
                            <circle cx="180" cy="72" r="5" fill="#8ecae6" />
                            <path d="M60 85 H220 L200 115 H80 Z" fill="#0b5ea8" />
                            <path
                                d="M0 125 q 15 -12 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 V150 H0 Z"
                                fill="#8ecae6" />
                        </svg>

                        <h1 class="display-6 mb-0">
                            Welcome, <span th:text="${#strings.capitalize(username)}">User</span>!
                        </h1>

                        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
                            <a th:if="${isAdmin}" th:href="@{/admin/users/new}" class="btn btn-primary">Create
                                account</a>
                            <a th:if="${isAdmin}" th:href="@{/admin/users}" class="btn btn-outline-primary">Manage
                                users</a>
                            <a th:href="@{/account/password}" class="btn btn-outline-secondary">Change password</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
