<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYW Fare Config</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex vh-100 overflow-hidden">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar-nav('fare-grid')}"></div>

    <!-- Main viewport -->
    <main class="flex-grow-1 p-4 overflow-y-auto" style="min-width: 0;">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h2 class="h4 fw-bold mb-1">Fare Grid Management</h2>
                <p class="text-muted small mb-0">Configure point-to-point routes and zonal price schedules</p>
            </div>

            <!-- Action Button Placeholders (Global) -->
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" disabled>
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Discard Drafts
                </button>
                <button type="button" class="btn btn-success btn-sm" disabled>
                    <i class="bi bi-check2-circle me-1"></i> Save Rate Changes
                    <span class="badge bg-light text-dark ms-1">0</span>
                </button>
            </div>
        </div>

        <div class="context-toolbar">
            <div class="tenant-context dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false"
                    th:text="${selectedTenant != null ? selectedTenant.displayName : 'Select Tenant'}">
                </button>
                <ul class="select-tenant dropdown-menu">
                    <li th:each="tenant:${availableTenants}">
                        <a class="dropdown-item" th:href="@{/fares(tenant=${tenant.id})}">
                            <span th:text="${tenant.displayName}"></span>
                        </a>
                    </li>
                </ul>

                <div th:if="${selectedTenant != null}">
                    <span>Mode: </span>
                    <span
                        th:text="${selectedTenant.gridMode == T(ca.sfu.cmpt276.nywfareconfig.fare.model.GridMode).OD ? 'Origin Destination' : 'Zonal'}"></span>
                </div>
                <!-- <select class="btn btn-secondary dropdown-toggle" name="selectedOption" id="choices">
                    <label for="roleType">Role:</label><br/>
                    <option class="dropdown-tiem" id="origin" th:each="originTerminal : ${originTerminals}" th:value="${originTerminal.originId}" th:text="${originTerminal.name}">
                    </option>
                </select>
                <button type="button" class="btn btn-primary">View</button> -->


                <!-- <form th:action="@{/fares(origin='originTerminal.originId')}" method="get"> -->
                <!-- <form th:action="@{/fares/}" method="get">

                    <select class="btn btn-secondary dropdown-toggle" name="terminal" id="origin" required>
                        <option class="dropdown-item" value="" selected disabled hidden>Select Origin Terminal</option>

                        <option class="dropdown-item" th:each="originTerminal : ${originTerminals}"
                            th:value="${originTerminal.originId}" th:text="${originTerminal.name}">
                        </option>
                    </select>

                    <button type="submit" class="btn btn-primary">View</button>
                </form> -->
            </div>
        </div>


    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
