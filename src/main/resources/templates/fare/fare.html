<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>NYW Fare Config</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/fare-grid.css}">
</head>

<body class="d-flex vh-100 overflow-hidden">

  <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar-nav('fare-grid')}"></div>

  <!-- Right Workspace Column (Global Top Navbar + Scrollable Main Content) -->
  <div class="d-flex flex-column flex-grow-1 overflow-hidden" style="min-width: 0;">

    <!-- Global Tenant Navbar Fragment (Displayed in every view) -->
    <div th:replace="~{fragments/navbar :: top-navbar}"></div>

    <!-- Main viewport -->
    <main class="flex-grow-1 p-4 overflow-y-auto" style="min-width: 0;">

      <!-- Header Section -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h4 fw-bold mb-1">Fare Grid Management</h2>
          <p class="text-muted small mb-0">Configure point-to-point routes and zonal price schedules</p>
        </div>
      </div>

      <!-- Context Selector Card (Filters Only) -->
      <div class="card shadow-sm mb-3" th:if="${tenantContext.selectedTenant != null}">
        <div class="card-body p-3">
          <form th:action="@{/fares}" method="get" class="row g-3 align-items-end">

            <div class="col-md-3 col-sm-6">
              <label
                th:text="${tenantContext.selectedTenant.odMode ? 'Origin Terminal' : 'Ticket Product'}"
                for="secondaryFilterDropdown" class="form-label fw-semibold small text-uppercase text-secondary">
              </label>

              <div class="input-group input-group-sm">

                <!-- Backend couldn't fetch secondary filters -->
                <select th:if="${caracalSecondaryFilterErrorMessage != null}" id="secondaryFilterDropdown"
                  class="form-select form-select-sm border-danger-subtle text-danger bg-danger-subtle"
                  style="min-width: 200px;" disabled aria-label="Tenant selection unavailable">
                  <option selected>Unavailable</option>
                </select>

                <select
                  th:if="${caracalSecondaryFilterErrorMessage == null}"
                  id="originSelect" name="secondaryFilter" class="form-select" onchange="this.form.submit()">
                  <option value="" th:selected="${tenantContext.secondaryFilter == null}"
                    th:text="${tenantContext.selectedTenant.odMode ? 'Select Terminal' : 'Selected a Ticket'}"></option>
                  <option th:each="filter : ${secondaryFilters}" th:value="${filter.code}"
                    th:text="${filter.displayName}"
                    th:selected="${tenantContext.secondaryFilter != null and tenantContext.secondaryFilter == filter.code}">
                  </option>
                </select>
              </div>

            </div>
          </form>
        </div>
      </div>

      <!-- Server-Side Workflow Guidance Feedback Cards -->
      <th:block th:if="${tenantContext.selectedTenant == null}">
        <div
          th:replace="~{fragments/feedback-card :: feedback-card('No Tenant Selected: Choose an active tenant above to begin configuration.', 'info')}">
        </div>
      </th:block>

      <th:block th:if="${tenantContext.selectedTenant != null and caracalSecondaryFilterErrorMessage != null}">
        <div th:replace="~{fragments/feedback-card :: feedback-card(${caracalSecondaryFilterErrorMessage}, 'danger')}">
        </div>
      </th:block>

      <th:block th:if="${caracalGridErrorMessage != null}">
        <div th:replace="~{fragments/feedback-card :: feedback-card(${caracalGridErrorMessage}, 'danger')}">
        </div>
      </th:block>

      <th:block th:if="${caracalSecondaryFilterErrorMessage == null}">

        <th:block
          th:if="${tenantContext.selectedTenant != null and tenantContext.selectedTenant.odMode and tenantContext.secondaryFilter == null}">
          <div
            th:replace="~{fragments/feedback-card :: feedback-card('Origin Terminal Required: Select a departure terminal to load outbound destination pricing.', 'warning')}">
          </div>
        </th:block>

        <th:block
          th:if="${tenantContext.selectedTenant != null and !tenantContext.selectedTenant.odMode and tenantContext.secondaryFilter == null}">
          <div
            th:replace="~{fragments/feedback-card :: feedback-card('Ticket Product Required: Select a fare product to populate the symmetric Zone-to-Zone matrix.', 'warning')}">
          </div>
        </th:block>

      </th:block>


      <!-- Client-Side Grid Feedback Cards (Toggled by fare-grid.js) -->
      <div id="grid-feedback-container">
        <div class="grid-feedback-slot" data-feedback-level="info" hidden>
          <div th:replace="~{fragments/feedback-card :: feedback-card('', 'info')}"></div>
        </div>
        <div class="grid-feedback-slot" data-feedback-level="warning" hidden>
          <div th:replace="~{fragments/feedback-card :: feedback-card('', 'warning')}"></div>
        </div>
        <div class="grid-feedback-slot" data-feedback-level="danger" hidden>
          <div th:replace="~{fragments/feedback-card :: feedback-card('', 'danger')}"></div>
        </div>
      </div>

      <!-- Fare Grid Card & Action Bar (Visible only when context is selected) -->
      <div class="card shadow border-bottom-0"
        th:if="${tenantContext.selectedTenant != null and tenantContext.secondaryFilter != null}">

        <!-- Operational Controls & Save/Discard Actions -->
        <div
          class="card-header bg-white border-bottom py-3 px-3 d-flex flex-wrap justify-content-between align-items-center gap-2">

          <!-- Context Creation & Configuration Actions -->
          <div class="d-flex flex-wrap gap-2 align-items-center">

            <!-- Zonal Actions -->
            <th:block
              th:if="${!tenantContext.selectedTenant.odMode}">
              <button type="button" class="btn btn-outline-primary btn-sm" title="View all system tiers">
                <i class="bi bi-layers me-1"></i> Manage Rate Tiers
              </button>
              <button type="button" class="btn btn-outline-dark btn-sm" title="Open Station to Zone Assignment Drawer">
                <i class="bi bi-diagram-3 me-1"></i> Station Zone Mapping
              </button>
            </th:block>
          </div>

          <!-- Edit State Actions (Close to Grid) -->
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" disabled id="discardDraftsBtn">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Discard Drafts
            </button>
            <button type="button" class="btn btn-success btn-sm" disabled id="saveChangesBtn">
              <i class="bi bi-check2-circle me-1"></i> Save Rate Changes
              <span class="badge bg-light text-dark ms-1" id="changesCounter">0</span>
            </button>
          </div>

        </div>

      </div>

      <!-- Render Matrix Table Fragment When Context is Fully Resolved -->
      <div th:if="${gridView != null}">
        <div th:replace="~{fare/fragments/fare-grid :: fare-grid-table}"></div>
      </div>

    </main>

  </div>

  <div th:replace="~{fare/fragments/rate-review-modal :: rateReviewModal}"></div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script th:src="@{/js/fare-grid.js}"></script>
  <script th:src="@{/js/draft-manager.js}"></script>
  <script th:src="@{/js/rate-review.js}"></script>

</body>

</html>
