<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

  <div th:fragment="feedback-card(text, level)"
    class="alert border-0 shadow-sm d-flex align-items-center mb-3"
    th:classappend="${level == 'danger' ? 'alert-danger' : (level == 'warning' ? 'alert-warning' : 'alert-info')}">
    <i class="bi fs-5 me-2"
      th:classappend="${level == 'danger' ? 'bi-exclamation-octagon-fill' : (level == 'warning' ? 'bi-exclamation-triangle-fill' : 'bi-info-circle-fill')}"></i>
    <div class="feedback-card-text" th:text="${text}">
      Feedback message
    </div>
  </div>

</body>

</html>
