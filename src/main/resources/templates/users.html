<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage users - NYW Fare Configuration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Manage users</h2>
                            <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm">Create account</a>
                        </div>

                        <div class="alert alert-success" th:if="${param.created != null}">
                            Account created.
                        </div>
                        <div class="alert alert-success" th:if="${param.roleChanged != null}">
                            Role updated. The user is signed out and gets the new role at their next login.
                        </div>
                        <div class="alert alert-danger" th:if="${param.error != null}">
                            <span th:if="${param.error[0] == 'self'}">You cannot change your own role.</span>
                            <span th:if="${param.error[0] == 'notfound'}">That user no longer exists.</span>
                            <span th:if="${param.error[0] == 'invalid'}">Please choose a valid role.</span>
                        </div>

                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="u : ${users}">
                                        <td th:text="${u.username}"></td>
                                        <td th:text="${u.email}"></td>
                                        <td>
                                            <span th:if="${u.id == currentUserId}">
                                                <span th:text="${u.role.label}"></span>
                                                <span class="text-muted">(you)</span>
                                            </span>
                                            <form th:unless="${u.id == currentUserId}"
                                                th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post"
                                                class="d-flex gap-2">
                                                <select name="role" class="form-select form-select-sm">
                                                    <option th:each="r : ${roles}" th:value="${r.name()}"
                                                        th:text="${r.label}" th:selected="${r == u.role}"></option>
                                                </select>
                                                <button type="submit" class="btn btn-primary btn-sm">Save</button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <a th:href="@{/dashboard}" class="btn btn-link mt-3 px-0">Back to dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
