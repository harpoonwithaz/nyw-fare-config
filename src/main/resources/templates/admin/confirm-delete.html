<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete account - NYW Fare Configuration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4 text-center">
                        <h2 class="mb-3">Delete account?</h2>
                        <p class="mb-1">You are about to permanently delete</p>
                        <p class="fw-bold mb-1" th:text="${target.username}"></p>
                        <p class="text-muted" th:text="${target.email}"></p>
                        <p class="text-muted">
                            This person will be signed out immediately and can no longer log in. This cannot be undone.
                        </p>
                        <form th:action="@{/admin/users/{id}/delete(id=${target.id})}" method="post">
                            <button type="submit" class="btn btn-danger w-100">Delete account</button>
                        </form>
                        <a th:href="@{/admin/users}" class="btn btn-link w-100 mt-2">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
