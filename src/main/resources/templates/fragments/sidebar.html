<!-- src/main/resources/templates/fragments/sidebar.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <aside th:fragment="sidebar-nav(activePage)"
           class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark h-100" 
           style="width: 280px;">
        
        <!-- Brand / Header -->
        <a th:href="@{/}" class="d-flex align-items-center mb-3 mb-md-0 text-white text-decoration-none">
            <span class="fs-3 fw-bold">Fare Config</span>
        </a>

        <hr class="border-secondary my-3">

        <!-- Navigation Links -->
        <ul class="nav nav-pills flex-column mb-auto gap-1">
            <li class="nav-item">
                <a th:href="@{/}" 
                   class="nav-link text-white"
                   th:classappend="${activePage == 'home'} ? 'active' : ''"
                   th:attr="aria-current=${activePage == 'home'} ? 'page' : null">
                    <i class="bi bi-house-door me-2"></i> Home
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/fares}" 
                   class="nav-link text-white"
                   th:classappend="${activePage == 'fare-matrix'} ? 'active' : ''"
                   th:attr="aria-current=${activePage == 'fare-matrix'} ? 'page' : null">
                    <i class="bi bi-grid-3x3 me-2"></i> Fare Matrix
                </a>
            </li>
            <li class="nav-item">
                <a 
                   class="nav-link text-white"
                   th:classappend="${activePage == 'availability'} ? 'active' : ''"
                   th:attr="aria-current=${activePage == 'availability'} ? 'page' : null">
                    <i class="bi bi-clock-history me-2"></i> Availability Rules
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/fares/alerts}"
                   class="nav-link text-white"
                   th:classappend="${activePage == 'alerts'} ? 'active' : ''"
                   th:attr="aria-current=${activePage == 'alerts'} ? 'page' : null">
                    <i class="bi bi-info-circle me-2"></i> Service Alerts &amp; TVM Canvas
                </a>
            </li>
            <li class="nav-item">
                <a 
                   class="nav-link text-white"
                   th:classappend="${activePage == 'publish'} ? 'active' : ''"
                   th:attr="aria-current=${activePage == 'publish'} ? 'page' : null">
                    <i class="bi bi-cloud-upload me-2"></i> Review &amp; Publish
                </a>
            </li>
        </ul>

        <hr class="border-secondary my-3">

        <!-- Bottom User Dropup -->
        <div class="dropdown dropup">
            <button class="btn btn-dark dropdown-toggle d-flex align-items-center text-white border-0 w-100 p-0 text-start shadow-none"
                    type="button" 
                    id="userMenuButton" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false">
                
                <!-- Authenticated user -->
                <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center me-2 text-white fw-semibold"
                     style="width: 32px; height: 32px; font-size: 0.85rem; flex-shrink: 0;"
                     th:text="${currentUser.username.substring(0, 2).toUpperCase()}">
                </div>

                <!-- Username / Email -->
                <span class="fw-semibold text-truncate me-auto" 
                      style="max-width: 160px;"
                      th:text="${currentUser.email}">
                </span>
            </button>

            <ul class="dropdown-menu dropdown-menu-dark shadow" aria-labelledby="userMenuButton">
                <li>
                    <h6 class="dropdown-header text-secondary small text-uppercase">
                        Role: <span class="text-white" th:text="${currentUser.role.label}"></span>
                    </h6>
                </li>
                <li><a class="dropdown-item" >Account Profile</a></li>
                <li><a class="dropdown-item" >Audit Log</a></li>
                <li><hr class="dropdown-divider border-secondary"></li>
                <li>
                    <!-- Spring Security CSRF-compliant logout POST -->
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item text-danger border-0 bg-transparent w-100 text-start">
                            Sign out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </aside>

</body>
</html>
