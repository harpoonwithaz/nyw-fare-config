<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

  <!-- Global Top Context Navbar Fragment -->
  <th:block th:fragment="top-navbar">
    <header
      class="bg-white border-bottom shadow-sm px-4 py-2 d-flex flex-wrap justify-content-between align-items-center gap-3">

      <!-- Left: Global Tenant Switcher -->
      <div class="d-flex align-items-center gap-2">
        <label for="globalTenantSelect"
          class="form-label fw-semibold small text-uppercase text-secondary mb-0 text-nowrap">
          <i class="bi bi-building me-1"></i> Tenant Environment
        </label>

        <!-- Caracal API failed to return tenants -->
        <div th:if="${caracalErrorMessage != null}" class="d-flex align-items-center gap-2">
          <select id="globalTenantSelect"
            class="form-select form-select-sm border-danger-subtle text-danger bg-danger-subtle"
            style="min-width: 200px;" disabled aria-label="Tenant selection unavailable">
            <option selected>Unavailable</option>
          </select>
        </div>

        <!-- Epic 2-5 views with loaded tenant list -->
        <form th:if="${caracalErrorMessage == null and availableTenants != null}"
          th:action="@{/context/tenant}" method="post" class="d-flex align-items-center gap-2 m-0">
          <input type="hidden" name="returnUrl" th:value="${currentUri}" />
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <select id="globalTenantSelect" name="tenant" class="form-select form-select-sm" style="min-width: 200px;"
            onchange="this.form.submit()">
            <option value="" th:selected="${tenantContext.selectedTenant == null}">Select Tenant</option>
            <option th:each="tenant : ${availableTenants}" th:value="${tenant.code}" th:text="${tenant.displayName}"
              th:selected="${tenantContext.selectedTenant != null and tenantContext.selectedTenant.code == tenant.code}">
            </option>
          </select>
        </form>

        <!-- Non-Switcher Views where availableTenants is not queried -->
        <span th:if="${caracalErrorMessage == null and availableTenants == null}"
          class="badge bg-light text-secondary border">
          Switchable in Fare / Alert Views
        </span>
      </div>

      <!-- Right: Active Workspace & Mode Indicator -->
      <div class="d-flex align-items-center gap-2">
        <span class="text-secondary small fw-semibold text-uppercase">Active Environment:</span>

        <th:block th:if="${tenantContext.selectedTenant != null}">
          <span class="fw-bold text-dark" th:text="${tenantContext.selectedTenant.displayName}"></span>
          <span class="badge bg-success-subtle text-success border border-success-subtle"
            th:text="${tenantContext.selectedTenant.defaultCurrency}">
          </span>
        </th:block>

        <span th:if="${tenantContext.selectedTenant == null}"
          class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">
          None Selected
        </span>
      </div>

    </header>

    <!-- Detailed Feedback Card Banner when Caracal API Errors Occur -->
    <div th:if="${caracalErrorMessage != null}" class="px-4 pt-3">
      <div th:replace="~{fragments/feedback-card :: feedback-card(${caracalErrorMessage}, 'danger')}"></div>
    </div>
  </th:block>

</body>

</html>
