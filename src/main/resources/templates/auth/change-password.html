<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex vh-100 overflow-hidden">

    <div th:replace="~{fragments/sidebar :: sidebar-nav('home')}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Change password</h2>

                        <div class="alert alert-danger" th:if="${errors != null && !errors.isEmpty()}">
                            <ul class="mb-0">
                                <li th:each="e : ${errors}" th:text="${e}"></li>
                            </ul>
                        </div>

                        <form th:action="@{/account/password}" method="post">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Current password</label>
                                <input type="password" class="form-control" id="currentPassword" name="currentPassword"
                                    placeholder="Current password" autocomplete="current-password" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New password</label>
                                <input type="password" class="form-control" id="newPassword" name="newPassword"
                                    placeholder="New password" autocomplete="new-password" minlength="8" required>
                                <div class="form-text">
                                    At least 8 characters, with an uppercase letter, a lowercase letter and a symbol.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm new password</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                    placeholder="Confirm new password" autocomplete="new-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Update password</button>
                            <a th:href="@{/dashboard}" class="btn btn-link w-100 mt-2">Back to dashboard</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
