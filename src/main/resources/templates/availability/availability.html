<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NY Waterway - Availability &amp; Lifecycle Management</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <!-- Optional Sidebar Fragment Integration -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse px-0 min-vh-100"
                 th:insert="~{fragments/sidebar :: sidebar-nav('availability')}">
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-calendar-check me-2"></i>Ticket Availability &amp; Route Rules</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-sm btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#groupEditModal">
                            <i class="bi bi-collection me-1"></i> Bulk Route Group Edit
                        </button>
                        <button type="button" class="btn btn-sm btn-success" id="saveChangesBtn">
                            <i class="bi bi-save me-1"></i> Save Changes
                        </button>
                    </div>
                </div>

                <!-- Include the Availability Table Fragment -->
                <div th:replace="~{availability/fragments/availability-table :: routeTable}"></div>
            </main>
        </div>
    </div>

    <!-- Bulk Edit Modal Fragment -->
    <div th:replace="~{availability/fragments/group-edit-modal :: groupEditModal}"></div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple interactive mock script for frontend prototype feedback
        document.getElementById('saveChangesBtn').addEventListener('click', function() {
            alert('Availability and pricing rules staged successfully!');
        });
    </script>
</body>
</html>
