<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Terminal & Product Availability | NYW Fare Config</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex vh-100 overflow-hidden">

  <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar-nav('availability')}"></div>

  <!-- Right Workspace Column (Global Top Navbar + Scrollable Main Content) -->
  <div class="d-flex flex-column flex-grow-1 overflow-hidden" style="min-width: 0;">

    <!-- Global Tenant Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: top-navbar}"></div>

    <!-- Main Content Area -->
    <main class="flex-grow-1 p-4 overflow-y-auto" style="min-width: 0;">

      <!-- Header Section -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h4 fw-bold mb-1">Terminal Ticket Availability</h2>
          <p class="text-muted small mb-0">Configure active ticket offerings and temporal sales conditions for terminal
            sites.</p>
        </div>
      </div>

      <!-- No Tenant Selected Feedback Card -->
      <th:block th:if="${tenantContext.selectedTenant == null}">
        <div
          th:replace="~{fare/fragments/feedback-card :: feedback-card('No Tenant Selected: Choose an active tenant above to configure terminal product availability.', 'info')}">
        </div>
      </th:block>

      <!-- Notification Banner -->
      <div id="availabilityAlert" class="alert alert-info alert-dismissible fade show d-none mb-3 shadow-sm"
        role="alert">
        <i class="bi bi-info-circle-fill me-2"></i>
        <span id="availabilityAlertText">Modifications are held in client staging buffer. Click "Save Availability
          Drafts" to persist to DB.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <!-- Context Selector Card (Filters Only) -->
      <div class="card shadow-sm mb-3" th:if="${tenantContext.selectedTenant != null}">
        <div class="card-body p-3">
          <form th:action="@{/availability}" method="get" class="row g-3 align-items-end">
            <!-- Terminal Selector -->
            <div class="col-md-3 col-sm-6">
              <label for="siteSelect" class="form-label fw-semibold small text-uppercase text-secondary">
                Terminal Site
              </label>
              <div class="input-group input-group-sm">
                <select id="siteSelect" name="site" class="form-select" onchange="this.form.submit()">
                  <option th:each="t : ${terminals}" th:value="${t.code}" th:selected="${t.code == siteCode}"
                    th:text="${t.name}">
                    Terminal Name
                  </option>
                </select>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Action Bar (Visible only when context is selected) -->
      <div class="card shadow border-bottom-0" th:if="${tenantContext.selectedTenant != null}">

        <!-- Operational Controls & Save/Discard Actions -->
        <div
          class="card-header bg-white border-bottom py-3 px-3 d-flex flex-wrap justify-content-between align-items-center gap-2">

          <!-- Actions -->
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <button type="button" id="btnOpenConditionModal" class="btn btn-outline-primary btn-sm"
              data-bs-toggle="modal" data-bs-target="#conditionBuilderModal">
              <i class="bi bi-calendar-plus me-1"></i>
              <span>Add Temporal Condition</span>
            </button>
          </div>

          <!-- Edit State Actions -->
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" disabled id="discardDraftsBtn">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Discard Drafts
            </button>
            <button type="button" id="btnSaveAvailabilityDrafts" class="btn btn-success btn-sm" disabled>
              <i class="bi bi-check2-circle me-1"></i> Save Availability Drafts
              <span class="badge bg-light text-dark ms-1" id="changesCounter">0</span>
            </button>
          </div>

        </div>

      </div>

      <div th:if="${tenantContext.selectedTenant != null}"
        class="card shadow-sm border-top-0 mb-4 rounded-top-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
          <div>
            <h6 class="mb-0 fw-bold text-dark">
              <i class="bi bi-card-checklist me-2"></i>Product Availability Rules
            </h6>
            <small class="text-muted">
              Terminal site:
              <span class="badge bg-primary-subtle text-primary border border-primary-subtle ms-1"
                th:text="${siteCode}">MIDTOWN</span>
            </small>
          </div>
          <span class="badge bg-secondary">AVAILABILITY MODE</span>
        </div>
        <div th:replace="~{availability/fragments/availability-table :: availabilityTable}"></div>
      </div>
    </main>
  </div>

  <!-- Modal Include -->
  <div th:if="${tenantContext.selectedTenant != null}"
    th:replace="~{availability/fragments/group-edit-modal :: conditionBuilderModal}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/availability.js}"></script>
</body>

</html>
