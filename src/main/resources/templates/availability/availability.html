<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>NY Waterway - Availability &amp; Lifecycle Management</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>



<body class="d-flex vh-100 overflow-hidden">

  <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar-nav('home')}"></div>

  <!-- Main viewport -->
  <main class="flex-grow-1 p-4 overflow-y-auto" style="min-width: 0;">
      <div
          class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2"><i class="bi bi-calendar-check me-2"></i>Ticket Availability &amp; Route Rules</h1>
          <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-sm btn-outline-primary me-2" data-bs-toggle="modal"
              data-bs-target="#groupEditModal">
              <i class="bi bi-collection me-1"></i> Bulk Route Group Edit
            </button>
            <button type="button" class="btn btn-sm btn-success" id="saveChangesBtn">
              <i class="bi bi-save me-1"></i> Save Changes
            </button>
          </div>
        </div>

        <!-- Include the Availability Table Fragment -->
        <div th:replace="~{availability/fragments/availability-table :: routeTable}"></div>
  </main>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Simple interactive mock script for frontend prototype feedback
    document.getElementById('saveChangesBtn').addEventListener('click', function () {
      alert('Availability and pricing rules staged successfully!');
    });
  </script>
</body>

</html>
