<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="availabilityTable" class="table-responsive">
    <table class="table table-bordered align-middle mb-0 text-center availability-table" id="availabilityTable"
           th:data-site="${siteCode}" th:data-dest="${destCode}" th:data-route="${routeCode}">
        <thead class="table-light">
            <tr>
                <th scope="col" class="text-secondary small text-uppercase text-start ps-3"
                    style="min-width: 180px;">
                    Product Category
                </th>
                <th scope="col" class="text-secondary small text-uppercase" style="min-width: 130px;">
                    Offering Status
                </th>
                <th scope="col" class="text-secondary small text-uppercase" style="min-width: 130px;">
                    Disabled Days / Constraints
                </th>
                <th scope="col" class="text-secondary small text-uppercase" style="min-width: 130px;">
                    Staging Status
                </th>
                <th scope="col" class="text-secondary small text-uppercase" style="min-width: 130px;">
                    Actions
                </th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prod : ${availabilityView.ticketProducts}"
                th:data-product="${prod}"
                th:data-site="${siteCode}"
                th:data-dest="${destCode}"
                th:data-route="${routeCode}">
                <td class="table-light text-secondary fw-semibold text-start ps-3">
                    <div class="d-flex align-items-center gap-2">
                        <span th:text="${prod}">ADULT_ONEWAY</span>
                    </div>
                </td>

                <td class="py-2 px-3">
                    <div class="form-check form-switch d-inline-flex align-items-center justify-content-center mb-0 custom-switch">
                        <input class="form-check-input mt-0 availability-toggle"
                               type="checkbox"
                               role="switch"
                               th:id="${'toggle-' + prod}"
                               th:checked="${availabilityView.isProductAvailable(prod)}"
                               th:data-product="${prod}">
                        <label class="form-check-label fw-bold text-dark ms-2 status-label"
                               th:for="${'toggle-' + prod}"
                               th:text="${availabilityView.isProductAvailable(prod) ? 'Available' : 'Unavailable'}">
                            Available
                        </label>
                    </div>
                </td>

                <td class="py-2 px-3">
                    <div class="temporal-condition-badge-container d-flex justify-content-center align-items-center gap-2">
                        <span class="badge border px-2 py-1 condition-badge"
                              th:classappend="${availabilityView.getConditionForProduct(prod) != null} ? 'bg-info-subtle text-info-emphasis border-info-subtle' : 'bg-secondary-subtle text-secondary border-secondary-subtle'">
                            <i class="bi bi-clock-history me-1"></i>
                            <span th:text="${availabilityView.getConditionSummary(prod)}">All Days Active</span>
                        </span>
                    </div>
                </td>

                <td class="py-2 px-3">
                    <span th:if="${availabilityView.savedInDb[prod]}"
                          class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-2 py-1 staged-badge">
                        <i class="bi bi-database-check me-1"></i>Saved in DB
                    </span>
                    <span th:unless="${availabilityView.savedInDb[prod]}"
                          class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 staged-badge">
                        <i class="bi bi-check-circle-fill me-1"></i>Live/Synced
                    </span>
                </td>

                <td class="py-2 px-3">
                    <button class="btn btn-sm btn-outline-secondary btn-configure-rule"
                            th:data-product="${prod}"
                            data-bs-toggle="modal"
                            data-bs-target="#conditionBuilderModal"
                            title="Configure Condition">
                        <i class="bi bi-gear-fill me-1"></i> Configure
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
