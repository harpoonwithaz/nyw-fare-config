<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="availabilityTable" class="table-responsive">
    <table class="table table-hover align-middle mb-0" id="availabilityTable">
        <thead class="table-light border-bottom">
            <tr>
                <th scope="col" class="ps-4" style="width: 25%;">Product Category</th>
                <th scope="col" style="width: 20%;">Offering Status</th>
                <th scope="col" style="width: 30%;">Disabled Days / Constraints</th>
                <th scope="col" style="width: 15%;">Staging Status</th>
                <th scope="col" class="text-end pe-4" style="width: 10%;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prod : ${availabilityView.ticketProducts}" th:data-product="${prod}" th:data-site="${siteCode}">
                <!-- Product Category Name -->
                <td class="ps-4 fw-semibold text-dark">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-ticket-perforated-fill text-primary fs-5"></i>
                        <span th:text="${prod}">ADULT</span>
                    </div>
                </td>

                <!-- Switch Toggle -->
                <td>
                    <div class="form-check form-switch custom-switch">
                        <input class="form-check-input availability-toggle" 
                               type="checkbox" 
                               role="switch" 
                               th:id="${'toggle-' + prod}"
                               th:checked="${availabilityView.isProductAvailable(prod)}"
                               th:data-product="${prod}">
                        <label class="form-check-label fw-medium ms-2 status-label" 
                               th:for="${'toggle-' + prod}"
                               th:text="${availabilityView.isProductAvailable(prod) ? 'Available' : 'Unavailable'}">
                            Available
                        </label>
                    </div>
                </td>

                <!-- Disabled Days / Temporal Rule Display -->
                <td>
                    <div class="temporal-condition-badge-container d-flex align-items-center gap-2">
                        <span class="badge bg-secondary-subtle text-secondary border condition-badge">
                            <i class="bi bi-clock-history me-1"></i>All Days Active
                        </span>
                    </div>
                </td>

                <!-- Staged Status Indicator -->
                <td>
                    <span class="badge bg-success-subtle text-success border staged-badge">
                        <i class="bi bi-check-circle-fill me-1"></i>Live/Synced
                    </span>
                </td>

                <!-- Action Menu -->
                <td class="text-end pe-4">
                    <button class="btn btn-sm btn-outline-secondary btn-configure-rule" 
                            th:data-product="${prod}"
                            data-bs-toggle="modal" 
                            data-bs-target="#conditionBuilderModal"
                            title="Configure Condition">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
