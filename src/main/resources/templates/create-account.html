<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account - NYW Fare Configuration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Create account</h2>

                        <div class="alert alert-danger" th:if="${errors != null && !errors.isEmpty()}">
                            <ul class="mb-0">
                                <li th:each="e : ${errors}" th:text="${e}"></li>
                            </ul>
                        </div>

                        <form th:action="@{/admin/users/new}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" th:value="${email}"
                                    placeholder="Enter email" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username"
                                    th:value="${username}" placeholder="Enter username" minlength="3" maxlength="30"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" name="role">
                                    <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.label}"
                                        th:selected="${r.name() == selectedRole}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Password" autocomplete="new-password" minlength="8" required>
                                <div class="form-text">
                                    At least 8 characters, with an uppercase letter, a lowercase letter and a symbol.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm password</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                    placeholder="Confirm password" autocomplete="new-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Create account</button>
                            <a th:href="@{/dashboard}" class="btn btn-link w-100 mt-2">Back to dashboard</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
